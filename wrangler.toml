name = "jatimetri-api"
main = "worker/src/index.ts"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]

# The API and the BCB login receiver run on the SAME host as the SPA (Cloudflare Pages), so the
# session cookie is first-party (`__Host-jatimetri_sesi`). Worker routes win over Pages for these paths.
routes = [
  { pattern = "jatimetri.belajarcarabelajar.com/api/*", zone_name = "belajarcarabelajar.com" },
  { pattern = "jatimetri.belajarcarabelajar.com/masuk-bcb*", zone_name = "belajarcarabelajar.com" },
]

# Secrets (values never in the repo):
#   BCB_SSO_RAHASIA  same value as SSO_RAHASIA_JATIMETRI on the BCB apex Worker (>= 32 chars, e.g. `openssl rand -hex 32`):
#                    bunx wrangler secret put BCB_SSO_RAHASIA
# Optional var: ALLOWED_ORIGINS (comma-separated extra browser origins, e.g. a Pages preview URL).

[env.production]
[[env.production.d1_databases]]
binding = "DB"
database_name = "inner_potential_db"
database_id = "dd1e85a5-07ad-43ca-8ff5-c65621e690ac"
[[env.production.r2_buckets]]
binding = "REPORTS_BUCKET"
bucket_name = "jatimetri-reports"

[[d1_databases]]
binding = "DB"
database_name = "inner_potential_db"
database_id = "dd1e85a5-07ad-43ca-8ff5-c65621e690ac"

[[r2_buckets]]
